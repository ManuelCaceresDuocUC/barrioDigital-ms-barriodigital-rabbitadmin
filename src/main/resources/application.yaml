server:
  port: 8086

spring:
  application:
    name: barriodigital-ms-rabbitadmin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/ffcb40ec-aa43-4c4e-acd8-4d27467872c5/v2.0}

barriodigital:
  rabbitadmin:
    # API HTTP de gestión de RabbitMQ: cubre lo que AMQP no ofrece (listar colas, exchanges y bindings).
    # Reutiliza las credenciales de la conexión AMQP.
    management:
      url: ${RABBITMQ_MGMT_URL:http://localhost:15672}
      username: ${spring.rabbitmq.username}
      password: ${spring.rabbitmq.password}
      timeout: 5s
    # Topología del caso que no se puede eliminar desde la API (admite el comodín *).
    protection:
      queues:
        - "q.cmd.*"
      exchanges:
        - "cmd.*"
        - "amq.*"
    # Lectura del contenido de mensajes sin consumirlos: solo en las colas de mensajes fallidos.
    inspection:
      queues:
        - "*.dlq"
      default-messages: 20
      max-messages: 50
      max-payload-bytes: 20000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
