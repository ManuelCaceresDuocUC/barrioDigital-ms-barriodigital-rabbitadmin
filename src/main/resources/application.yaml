server:
  port: 8086

spring:
  application:
    name: barriodigital-ms-rabbitadmin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s

barriodigital:
  rabbitadmin:
    management:
      url: ${RABBITMQ_MGMT_URL:http://localhost:15672}
      username: ${RABBITMQ_USER}
      password: ${RABBITMQ_PASSWORD}
      timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
